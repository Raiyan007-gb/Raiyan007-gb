# Deploys the chat proxy (worker.js) to Cloudflare Workers, publishes the
# OpenRouter key as an encrypted Worker secret, and wires the workers.dev URL
# into chat.html — all from repo secrets. The key never touches git or the
# browser.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  - API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID - Account ID from dash.cloudflare.com (URL or overview)
#   OPENROUTER_KEY        - fresh OpenRouter key (revoke any previously exposed one)
name: Deploy chat proxy
on:
  workflow_dispatch:
  push:
    paths:
      - worker.js
      - wrangler.toml
      - .github/workflows/deploy-proxy.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm i -g wrangler

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy 2>&1 | tee deploy.log
          grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 > worker.url || true

      - name: Publish OpenRouter key as worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          test -n "$OPENROUTER_KEY" || { echo "::error::OPENROUTER_KEY secret is empty"; exit 1; }
          printf '%s' "$OPENROUTER_KEY" | wrangler secret put OPENROUTER_KEY

      - name: Wire worker URL into chat.html
        run: |
          URL="$(cat worker.url 2>/dev/null || true)"
          if [ -z "$URL" ]; then
            echo "::warning::Could not parse workers.dev URL from deploy output — set WORKER_URL in chat.html manually"
            exit 0
          fi
          sed -i "s|^const WORKER_URL = .*;|const WORKER_URL = \"$URL\";|" chat.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- chat.html && echo "URL already wired" || {
            git add chat.html
            git commit -m "Wire deployed worker URL into chat.html"
            git push
          }
