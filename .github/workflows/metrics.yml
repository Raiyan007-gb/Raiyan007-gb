# lowlighter/metrics — renders profile SVGs and commits them to this repo.
# Needs a `METRICS_TOKEN` repo secret holding a CLASSIC personal access
# token (fine-grained tokens are rejected by the metrics action).
# No scopes required.
# Runs daily + on demand via "Run workflow". No push trigger (avoids loops).
name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Isometric commit calendar (half year)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Raiyan007-gb
          template: classic
          filename: metrics-isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
      # Achievements, compact display
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Raiyan007-gb
          template: classic
          filename: metrics-achievements.svg
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
